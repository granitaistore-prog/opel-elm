name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Забрати код
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Java 17 (обовʼязково)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Дати права gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4️⃣ Відновити keystore з Secrets
      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/opel_release.keystore

      # 5️⃣ Зібрати RELEASE APK
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      # 6️⃣ Завантажити APK як artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Opel-Diagnostic-RELEASE-APK
          path: app/build/outputs/apk/release/*.apk
