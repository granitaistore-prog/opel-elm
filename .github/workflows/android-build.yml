name: Android Debug & Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Розкодовуємо keystore з секретів
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/opel-release.jks

      # Збірка Debug
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # Збірка Release (підписаний)
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # Вивантаження Debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Opel-OBD-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      # Вивантаження Release
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Opel-OBD-Release-APK
          path: app/build/outputs/apk/release/*.apk
