name: Android Debug & Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Забрати код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Java 17 (обовʼязково для AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Дозвіл на gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Decode keystore (для Release)
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/opel-release.jks

      # 5️⃣ Створити gradle.properties з підписом
      - name: Create gradle.properties for signing
        run: |
          echo "RELEASE_STORE_FILE=opel-release.jks" >> app/gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> app/gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> app/gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> app/gradle.properties

      # 6️⃣ Debug APK (без підпису)
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      # 7️⃣ Release APK (підписаний)
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      # 8️⃣ Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Opel-OBD-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      # 9️⃣ Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Opel-OBD-Release-APK
          path: app/build/outputs/apk/release/*.apk
